<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário + API JSONPlaceholder</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #f7f9fb;
      transition: background-color 0.3s, color 0.3s;
    }
    .dark-mode {
      background-color: #121212;
      color: #f1f1f1;
    }
    .dark-mode .card {
      background-color: #1e1e1e;
      border-color: #333;
    }
    .dark-mode input, 
    .dark-mode textarea {
      background-color: #222;
      color: #f1f1f1;
      border: 1px solid #444;
    }
    .fs-form {
      max-width: 600px;
      margin: 20px auto;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.1);
    }
    .dark-mode .fs-form {
      background: #1f1f1f;
    }
    .card {
      margin-bottom: 1rem;
    }
  </style>
</head>

<body class="container py-4">

  <h1 class="text-center mb-4">📋 Formulário </h1>

  <!-- BOTÃO DE MODO ESCURO -->
  <div class="text-center mb-4">
    <button id="toggleDark" class="btn btn-secondary">🌙 Alternar Modo Escuro</button>
  </div>

  <!-- FORMULÁRIO ORIGINAL -->
  <form
    action="https://formspree.io/f/xanljpbn"
    class="fs-form"
    target="_top"
    method="POST"
  >
    <div class="fs-field mb-3">
      <label class="form-label" for="nome-sobrenome">Nome e Sobrenome</label>
      <input
        class="form-control"
        type="text"
        id="nome-sobrenome"
        name="nome-sobrenome"
        placeholder="Digite seu nome completo"
        pattern="[A-Za-zÀ-ÿ\s]+"
        title="Digite apenas letras"
        required
      />
    </div>

    <div class="fs-field mb-3">
      <label class="form-label" for="email">E-mail</label>
      <input
        class="form-control"
        type="email"
        id="email"
        name="email"
        placeholder="exemplo@dominio.com"
        pattern="[a-zA-Z._%+-]+@[a-zA-Z.-]+\.[a-zA-Z]{2,}$"
        title="Digite um e-mail válido (somente letras permitidas)"
        required
      />
    </div>

    <div class="fs-field mb-3">
      <label class="form-label" for="telefone">Telefone</label>
      <input
        class="form-control"
        type="tel"
        id="telefone"
        name="telefone"
        placeholder="Ex: 11 91234 5678"
        pattern="[\d\s]{10,15}"
        title="Digite apenas números e espaços (ex: 11 91234 5678)"
        required
      />
    </div>

    <div class="fs-field mb-3">
      <label class="form-label" for="message">Mensagem</label>
      <textarea
        class="form-control"
        id="message"
        name="message"
        placeholder="Digite sua mensagem"
        required
      ></textarea>
    </div>

    <div class="fs-button-group text-center">
      <button class="btn btn-primary" type="submit">Enviar</button>
    </div>
  </form>

  <hr class="my-5">

  <!-- SEÇÃO DA API -->
  <section>
    <h2 class="text-primary">📰 Posts</h2>

    <!-- Campo de busca -->
    <div class="input-group mb-3">
      <input type="text" id="search" class="form-control" placeholder="Buscar post por título...">
      <button class="btn btn-outline-primary" id="searchBtn">🔍 Buscar</button>
    </div>

    <div id="posts" class="row g-3"></div>
    <div class="text-center mt-3">
      <button class="btn btn-outline-success" id="loadMore">Carregar mais</button>
    </div>
  </section>

  <section class="mt-5">
    <h2 class="text-success">👤 Usuários</h2>
    <div id="users" class="row g-3"></div>
  </section>

  <section class="mt-5">
    <h2 class="text-info">💬 Comentários</h2>
    <p>Clique em um post para ver seus comentários.</p>
    <div id="comments" class="row g-3"></div>
  </section>

  <!-- SCRIPT -->
  <script>
    let posts = [];
    let currentIndex = 0;
    const perPage = 5;

    const postsContainer = document.getElementById('posts');
    const commentsContainer = document.getElementById('comments');

    // Função utilitária para criar cards
    function createCard(title, body, color = "light") {
      return `
        <div class="col-md-6 col-lg-4">
          <div class="card border-${color}">
            <div class="card-body">
              <h5 class="card-title">${title}</h5>
              <p class="card-text">${body}</p>
            </div>
          </div>
        </div>
      `;
    }

    // Carregar posts
    async function carregarPosts() {
      const res = await fetch('https://jsonplaceholder.typicode.com/posts');
      posts = await res.json();
      exibirPosts();
    }

    // Exibir posts por página
    function exibirPosts() {
      const slice = posts.slice(currentIndex, currentIndex + perPage);
      slice.forEach(post => {
        const div = document.createElement('div');
        div.className = 'col-md-6 col-lg-4';
        div.innerHTML = `
          <div class="card border-primary h-100" style="cursor:pointer;">
            <div class="card-body">
              <h5 class="card-title">${post.title}</h5>
              <p class="card-text">${post.body}</p>
            </div>
          </div>`;
        div.onclick = () => carregarComentarios(post.id);
        postsContainer.appendChild(div);
      });
      currentIndex += perPage;
    }

    // Buscar posts por título
    document.getElementById('searchBtn').addEventListener('click', () => {
      const termo = document.getElementById('search').value.toLowerCase();
      postsContainer.innerHTML = '';
      posts
        .filter(p => p.title.toLowerCase().includes(termo))
        .forEach(post => {
          const div = document.createElement('div');
          div.className = 'col-md-6 col-lg-4';
          div.innerHTML = `
            <div class="card border-primary h-100">
              <div class="card-body">
                <h5 class="card-title">${post.title}</h5>
                <p class="card-text">${post.body}</p>
              </div>
            </div>`;
          postsContainer.appendChild(div);
        });
    });

    // Botão de carregar mais
    document.getElementById('loadMore').addEventListener('click', exibirPosts);

    // Carregar usuários
    async function carregarUsuarios() {
      const res = await fetch('https://jsonplaceholder.typicode.com/users');
      const users = await res.json();
      const container = document.getElementById('users');
      container.innerHTML = '';
      users.forEach(u => {
        const content = `
          <strong>Email:</strong> ${u.email}<br>
          <strong>Cidade:</strong> ${u.address.city}<br>
          <strong>Website:</strong> ${u.website}
        `;
        container.innerHTML += createCard(u.name, content, "success");
      });
    }

    // Carregar comentários de um post
    async function carregarComentarios(postId) {
      const res = await fetch(`https://jsonplaceholder.typicode.com/posts/${postId}/comments`);
      const comments = await res.json();
      commentsContainer.innerHTML = `<h4>💬 Comentários do Post #${postId}</h4>`;
      comments.forEach(c => {
        const content = `<strong>${c.email}</strong><br>${c.body}`;
        commentsContainer.innerHTML += createCard(c.name, content, "info");
      });
      commentsContainer.scrollIntoView({ behavior: "smooth" });
    }

    // Alternar modo escuro
    document.getElementById('toggleDark').addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
    });

    // Inicializar
    carregarPosts();
    carregarUsuarios();
  </script>
</body>
</html>
